# ==============================================================================
# FitAI — Application Configuration Properties
# Configured for Local Development, Testing, and Cloud Deployment on Render
# ==============================================================================

# Server Port
# Render sets the $PORT environment variable dynamically (e.g. 10000); default 8080 locally
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# Spring Application Metadata
spring.application.name=fitai-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# JPA & Hibernate General Settings
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Cache Configuration (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=exercises,foodItems,knowledgeDocs
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60m


# ==============================================================================
# Datasource Configuration
# DatabaseConfig automatically parses Render PostgreSQL DATABASE_URL or uses fallback
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:fitai_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# Embedded H2 Console (available locally when running with H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================================================================
# Application Security & JWT Configuration
# ==============================================================================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# AI Provider Settings (demo mode requires no external API keys)
app.ai.provider=${AI_PROVIDER:demo}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gpt-4o-mini}

# CORS Allowed Origins (Includes Vercel frontend, wildcard subdomains, Render, and local dev)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://fit-ai-frontend-gamma.vercel.app,https://*.vercel.app,https://*.onrender.com,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Actuator Endpoints (For Render Health Checks)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
