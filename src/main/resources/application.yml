server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: fitai-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2} # Default to embedded H2 for instant local zero-config run, override to 'mysql' via env/docker

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  cache:
    type: caffeine
    cache-names:
      - exercises
      - foodItems
      - knowledgeDocs
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60m

---
# MySQL Profile for Local MySQL / Docker / Staging / Production
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fitai_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

---
# Embedded H2 Profile for Local Development and Zero-Dependency Verification
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:fitai_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

---
# App Security and AI Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  ai:
    provider: ${AI_PROVIDER:demo} # 'demo', 'openai', 'gemini'
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
